repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        language: system
        entry: gofumpt -w
        types: [go]

      - id: goimports
        name: goimports
        language: system
        entry: goimports -w -local github.com/kradalby/tsnixcache
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: golangci-lint run
        pass_filenames: false
        types: [go]

      - id: nixpkgs-fmt
        name: nixpkgs-fmt
        language: system
        entry: nixpkgs-fmt
        files: \.nix$
