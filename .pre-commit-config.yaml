repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: local
    hooks:
      - id: treefmt
        name: treefmt
        language: system
        entry: treefmt --fail-on-change
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --new-from-rev=HEAD~1 --fix
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test
        name: go test
        entry: nix develop --command -- go test -short -timeout=5m ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: nix-build-checks
        name: nix build checks (non-VM)
        entry: nix build --no-write-lock-file --fallback .#nativeChecks
        language: system
        files: ^(flake\.(nix|lock)|flakehashes\.json|go\.(mod|sum)|pyproject\.toml|nix/tests/.*\.py)$
        pass_filenames: false

      - id: vendor-hash
        name: flakehashes.json vendor hash
        entry: nix develop --command -- go run ./cmd/vendorhash check
        language: system
        files: ^(go\.(mod|sum)|flakehashes\.json)$
        pass_filenames: false
